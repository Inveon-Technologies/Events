# Log rotation for every container (Docker's json-file driver): each
# service keeps at most 5 files of 10MB, so logs can never fill the disk.
# The API writes structured JSON lines (pino) — see apps/api/src/logger.ts.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  nginx:
    image: nginx:1.27-alpine
    # Bound to localhost only, on an alternate port — this server already
    # has inveontechnologies-web owning the real public 80/443 (see `docker
    # ps`), and crm_frontend/crm_backend establish the existing convention
    # for internal-only services on this box (127.0.0.1:<port>). Events
    # follows that same pattern rather than competing for 80/443.
    #
    # TLS termination happens at whichever nginx owns the real public
    # 80/443 — not here. Once DNS for events.inveontechnologies.in points
    # at this server, add a server{} block to *that* nginx's config
    # proxying to 127.0.0.1:8081, and it'll handle HTTPS for this
    # subdomain the same way it already does for the main site.
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - web_static:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped
    logging: *default-logging

  api:
    image: ghcr.io/inveon-technologies/events-api:${IMAGE_TAG:-latest}
    env_file:
      # Relative to this file's own directory (docker/) — docker compose
      # resolves relative paths against wherever you invoke it from when
      # that's where the compose file lives, i.e. `cd docker && docker
      # compose up`, not the repo root.
      - ../apps/api/.env
    environment:
      - NODE_ENV=production
    # Uploaded images (when S3 isn't configured) live here. Without a
    # volume they were inside the container and vanished on every deploy,
    # leaving broken images everywhere.
    volumes:
      - uploads:/app/uploads
    # Wait for Postgres to actually accept connections, not just for its
    # container to exist — otherwise the API's first queries (and the
    # migration step) race the database's startup.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  # Static build output only — copies the built React app into a shared
  # volume that nginx serves directly, then exits. Not a long-running service.
  web:
    image: ghcr.io/inveon-technologies/events-web:${IMAGE_TAG:-latest}
    volumes:
      - web_static:/usr/share/nginx/html
    restart: "no"
    logging: *default-logging

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: inveon_events
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d inveon_events"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    # Persistence + memory policy tuned for the job queue — see the file.
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

volumes:
  pg_data:
  redis_data:
  uploads:
  web_static:
