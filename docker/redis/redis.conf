# Redis for Inveon Events (#69). Holds three kinds of data:
#   - the BullMQ job queue (emails waiting to send, scheduled jobs)
#   - sign-in / signup OTP codes
#   - rate-limit counters
# Losing the queue loses emails, so it is persisted to disk.

bind 0.0.0.0
# only reachable on the compose network, never published
protected-mode no
port 6379

# --- Persistence ------------------------------------------------------
# Append-only file, fsync'd once a second: at most ~1s of writes can be
# lost on a crash, at negligible cost for this workload.
appendonly yes
appendfsync everysec
# compact rewrites, fast restarts
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
no-appendfsync-on-rewrite no

# Plus periodic RDB snapshots — a second, single-file copy that is easy to
# back up (see scripts/backup-db.sh).
save 900 1
save 300 100
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
dir /data

# --- Memory -----------------------------------------------------------
# BullMQ requires noeviction: an evicted job key silently loses an email.
# When full, Redis rejects writes instead, the API falls back to running
# jobs inline (see apps/api/src/queue) and the error shows in the logs.
maxmemory 256mb
maxmemory-policy noeviction

# --- Connections ------------------------------------------------------
tcp-keepalive 60
timeout 0

# --- Housekeeping -----------------------------------------------------
loglevel notice
latency-monitor-threshold 100
slowlog-log-slower-than 10000
slowlog-max-len 128
