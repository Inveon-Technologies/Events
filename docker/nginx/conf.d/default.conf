server {
    listen 80;
    server_name _;

    # Security headers for the SPA and the API. TLS/HSTS are added by the
    # public front door (see docker/nginx/front-door/), which owns 443.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

    # Proxy API and health check to the api container. Everything else
    # (below) is the React SPA's static build.
    location /api/ {
        proxy_pass http://events_api/api/;
        proxy_http_version 1.1;
        # Required for upstream keepalive.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $events_request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        # Media uploads (ffprobe on a 10MB video) and report exports can
        # take a while; everything else answers in milliseconds.
        proxy_read_timeout 120s;
        # Stream uploads straight to the API rather than buffering to disk
        # here first.
        proxy_request_buffering off;
    }

    location = /health {
        proxy_pass http://events_api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    root /usr/share/nginx/html;
    index index.html;

    # ---- Search engines (see apps/api/src/services/seo.ts) -------------
    # Public pages get their first HTML from the API: the same index.html
    # with real <title>, description, Open Graph tags, schema.org JSON-LD
    # (Google's event cards) and a plain-HTML summary. If the API can't
    # answer, the plain SPA is served instead, so the site never breaks.
    location = /sitemap.xml {
        proxy_pass http://events_api/api/seo/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location ~ ^/(|events|organizers|events/[^/]+|organizers/[^/]+|contact|terms|privacy|refund-policy)/?$ {
        # A regex location can't give proxy_pass a URI, so rewrite first
        # (keeping the page's own path for the X-Seo-Path header).
        set $seo_path $uri;
        rewrite ^ /api/seo/page break;
        proxy_pass http://events_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $events_request_id;
        proxy_set_header X-Seo-Path $seo_path;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa;
    }

    location @spa {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /index.html =404;
    }

    # Static assets: let the browser cache Vite's content-hashed filenames
    # aggressively — a new build always gets new filenames, so there's no
    # staleness risk.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
        access_log off;
    }

    # index.html must never be cached, or browsers keep loading the old
    # build's (now deleted) asset filenames after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # React Router client-side routing: any path that isn't a real static
    # file falls back to index.html so the SPA's own router can render it.
    location / {
        try_files $uri /index.html;
    }
}
