server {
    listen 80;
    server_name _;

    # Security headers for the SPA and the API. TLS/HSTS are added by the
    # public front door (see docker/nginx/front-door/), which owns 443.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

    # Proxy API and health check to the api container. Everything else
    # (below) is the React SPA's static build.
    location /api/ {
        proxy_pass http://events_api/api/;
        proxy_http_version 1.1;
        # Required for upstream keepalive.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $events_request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        # Media uploads (ffprobe on a 10MB video) and report exports can
        # take a while; everything else answers in milliseconds.
        proxy_read_timeout 120s;
        # Stream uploads straight to the API rather than buffering to disk
        # here first.
        proxy_request_buffering off;
    }

    location = /health {
        proxy_pass http://events_api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    root /usr/share/nginx/html;
    index index.html;

    # Static assets: let the browser cache Vite's content-hashed filenames
    # aggressively — a new build always gets new filenames, so there's no
    # staleness risk.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
        access_log off;
    }

    # index.html must never be cached, or browsers keep loading the old
    # build's (now deleted) asset filenames after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # React Router client-side routing: any path that isn't a real static
    # file falls back to index.html so the SPA's own router can render it.
    location / {
        try_files $uri /index.html;
    }
}
