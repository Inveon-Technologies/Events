server {
    listen 80;
    server_name _;

    # Proxy API and health check to the api container. Everything else
    # (below) is the React SPA's static build.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    root /usr/share/nginx/html;
    index index.html;

    # Static assets: let the browser cache Vite's content-hashed filenames
    # aggressively — a new build always gets new filenames, so there's no
    # staleness risk.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # React Router client-side routing: any path that isn't a real static
    # file falls back to index.html so the SPA's own router can render it.
    location / {
        try_files $uri /index.html;
    }
}
