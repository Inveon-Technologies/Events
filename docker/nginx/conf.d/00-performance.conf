# http-level tuning (#68). Files in conf.d/ are included inside the
# stock nginx.conf's http {} block, so these apply to every server.

# --- Compression ------------------------------------------------------
# JSON API responses and the SPA's JS/CSS compress 70-85%. Images, video
# and fonts in woff2 are already compressed, so they're left alone.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
  application/javascript
  application/json
  application/manifest+json
  application/xml
  image/svg+xml
  text/css
  text/javascript
  text/plain
  text/xml;

# --- Connections ------------------------------------------------------
keepalive_timeout 65;
keepalive_requests 1000;
server_tokens off;

# Uploads: event images/videos are capped at 10MB by the API; multipart
# overhead needs a little more. The stock 1MB default rejected every
# real photo with a 413 before it ever reached the API.
client_max_body_size 12m;
client_body_buffer_size 256k;

# Keep-alive connections to the API instead of a new TCP connection per
# request.
upstream events_api {
  server api:3000;
  keepalive 32;
}

# Keep a request id the front door already assigned (so one id follows
# the request through every hop into the API's logs); otherwise mint one.
map $http_x_request_id $events_request_id {
  default $http_x_request_id;
  ""      $request_id;
}
