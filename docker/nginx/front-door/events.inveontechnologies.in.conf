# Public front door for events.inveontechnologies.in (#9) — HTTPS.
#
# Goes into the nginx that owns the server's public ports 80/443 (on the
# production VPS that is the main site's nginx, in the
# inveontechnologies-website repo), NOT into this stack's nginx. It
# terminates TLS and forwards everything to this stack's nginx on
# 127.0.0.1:8081 (docker/docker-compose.yml).
#
# Certificate: Let's Encrypt via certbot's webroot mode, issued and
# renewed by scripts/server/setup-ssl.sh. See docs/ops/RUNBOOK.md#tls.
#
# If the front door itself runs in a container, 127.0.0.1 is the
# container, not the host: use host.docker.internal (with
# extra_hosts: ["host.docker.internal:host-gateway"]) or the host's
# docker bridge IP instead, and mount /etc/letsencrypt and
# /var/www/certbot into it read-only.

upstream events_stack {
    server 127.0.0.1:8081;
    keepalive 16;
}

# HTTP: only the ACME challenge; everything else goes to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name events.inveontechnologies.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # "listen ... http2" works on every nginx version (1.25.1+ also has
    # "http2 on;" and warns that this form is deprecated — harmless).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name events.inveontechnologies.in;

    ssl_certificate     /etc/letsencrypt/live/events.inveontechnologies.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/events.inveontechnologies.in/privkey.pem;

    # Mozilla "intermediate" profile: TLS 1.2 + 1.3, modern ciphers.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:events_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # One year, this host only. Add includeSubDomains/preload only once
    # every subdomain of inveontechnologies.in serves HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Must match (or exceed) the stack's own limit — see
    # docker/nginx/conf.d/00-performance.conf.
    client_max_body_size 12m;

    location / {
        proxy_pass http://events_stack;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The API builds payment return URLs and trusts cookies based on
        # this — it must say https.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }
}
