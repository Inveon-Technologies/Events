name: One-off - Configure Cashfree sandbox credentials

on:
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-latest
    environment: AWS 13.51.250.242
    steps:
      - name: Add Cashfree env vars and restart API
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          CASHFREE_APP_ID: ${{ secrets.TEMP_CASHFREE_APP_ID }}
          CASHFREE_SECRET_KEY: ${{ secrets.TEMP_CASHFREE_SECRET_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "
            set -e
            cd /var/www/Events/apps/api
            # Idempotent: remove any existing lines for these keys first
            # (a re-run of this workflow, or an earlier partial attempt,
            # should not leave duplicate/conflicting entries), then
            # append the current values fresh.
            sed -i '/^CASHFREE_APP_ID=/d;/^CASHFREE_SECRET_KEY=/d;/^CASHFREE_ENV=/d;/^API_PUBLIC_URL=/d;/^PLATFORM_FEE_PERCENT=/d' .env
            cat >> .env << ENVEOF
CASHFREE_APP_ID=$CASHFREE_APP_ID
CASHFREE_SECRET_KEY=$CASHFREE_SECRET_KEY
CASHFREE_ENV=sandbox
API_PUBLIC_URL=https://events.inveontechnologies.in
PLATFORM_FEE_PERCENT=5
ENVEOF
            cd /home/ubuntu/inveontechnologies-website
            docker compose --env-file .env --env-file .env.deploy restart events-api
            sleep 5
            docker compose ps events-api
          "
