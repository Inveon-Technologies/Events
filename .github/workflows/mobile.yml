name: Mobile

on:
  pull_request:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']
  push:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

jobs:
  # Every app update ships with release notes: both apps carry the same
  # version, and apps/mobile/RELEASE_NOTES.md must have a section for it.
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version and release notes
        run: |
          v() { sed -n 's/^version: *\([^+]*\).*/\1/p' "apps/mobile/$1/pubspec.yaml"; }
          customer=$(v customer_app); organizer=$(v organizer_app)
          if [ "$customer" != "$organizer" ]; then
            echo "::error::customer_app is $customer but organizer_app is $organizer. Bump both pubspec versions together."
            exit 1
          fi
          if ! grep -q "^## $customer " apps/mobile/RELEASE_NOTES.md; then
            echo "::error file=apps/mobile/RELEASE_NOTES.md::No release notes for $customer. Add a '## $customer (build N), <date>' section at the top."
            exit 1
          fi
          echo "Release notes found for $customer"

  flutter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [packages/inveon_core, customer_app, organizer_app]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        if: matrix.project != 'packages/inveon_core'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Install packages
        working-directory: apps/mobile/${{ matrix.project }}
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile/${{ matrix.project }}
        run: flutter analyze

      - name: Test
        working-directory: apps/mobile/${{ matrix.project }}
        run: flutter test

      # Proves the Android project (Gradle, plugins, manifest) builds, and
      # leaves an installable APK on the run. Without google-services.json
      # push is off in this build, and until a release keystore is set up
      # it is signed with the debug key (fine for sideloading, not the stores).
      #
      # One APK per CPU type instead of one "fat" APK carrying all three:
      # arm64 covers nearly every phone, armeabi-v7a the old 32-bit ones,
      # and x86_64 (emulators only) is left out. Dart code is obfuscated,
      # with its debug symbols kept out of the APK.
      - name: Build release APKs
        if: matrix.project != 'packages/inveon_core'
        working-directory: apps/mobile/${{ matrix.project }}
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --obfuscate --split-debug-info=build/symbols
          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Upload APKs
        if: matrix.project != 'packages/inveon_core'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-apk
          path: |
            apps/mobile/${{ matrix.project }}/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            apps/mobile/${{ matrix.project }}/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30

  # Publishes both APKs on a GitHub Release (mobile-v<version>) so they can
  # be downloaded straight to a phone. Re-running for the same version
  # replaces the APKs on that release.
  release:
    if: github.event_name != 'pull_request'
    needs: [release-notes, flutter]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: apks

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' apps/mobile/customer_app/pubspec.yaml)
          tag="mobile-v$version"
          # The plain name is the one to install; "-older-phones" is for
          # 32-bit phones that refuse it.
          cp apks/customer_app-apk/app-arm64-v8a-release.apk "inveon-events-$version.apk"
          cp apks/customer_app-apk/app-armeabi-v7a-release.apk "inveon-events-$version-older-phones.apk"
          cp apks/organizer_app-apk/app-arm64-v8a-release.apk "inveon-organizer-$version.apk"
          cp apks/organizer_app-apk/app-armeabi-v7a-release.apk "inveon-organizer-$version-older-phones.apk"
          # This version's section of RELEASE_NOTES.md only.
          awk -v v="$version" '/^## /{on = index($0, "## " v " ") == 1} on' apps/mobile/RELEASE_NOTES.md > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" inveon-*.apk --clobber
          else
            gh release create "$tag" inveon-*.apk \
              --title "Inveon mobile apps $version" \
              --notes-file notes.md \
              --target "$GITHUB_SHA"
          fi
