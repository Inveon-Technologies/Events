name: Mobile

on:
  pull_request:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']
  push:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [packages/inveon_core, customer_app, organizer_app]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        if: matrix.project != 'packages/inveon_core'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Install packages
        working-directory: apps/mobile/${{ matrix.project }}
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile/${{ matrix.project }}
        run: flutter analyze

      - name: Test
        working-directory: apps/mobile/${{ matrix.project }}
        run: flutter test

      # Proves the Android project (Gradle, plugins, manifest) builds, and
      # leaves an installable APK on the run. Without google-services.json
      # push is off in this build, and until a release keystore is set up
      # it is signed with the debug key (fine for sideloading, not the stores).
      - name: Build release APK
        if: matrix.project != 'packages/inveon_core'
        working-directory: apps/mobile/${{ matrix.project }}
        run: flutter build apk --release

      - name: Upload APK
        if: matrix.project != 'packages/inveon_core'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-apk
          path: apps/mobile/${{ matrix.project }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # Publishes both APKs on a GitHub Release (mobile-v<version>) so they can
  # be downloaded straight to a phone. Re-running for the same version
  # replaces the APKs on that release.
  release:
    if: github.event_name != 'pull_request'
    needs: flutter
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: apks

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' apps/mobile/customer_app/pubspec.yaml)
          tag="mobile-v$version"
          cp apks/customer_app-apk/app-release.apk "inveon-events-$version.apk"
          cp apks/organizer_app-apk/app-release.apk "inveon-organizer-$version.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" inveon-*.apk --clobber
          else
            gh release create "$tag" inveon-*.apk \
              --title "Inveon mobile apps $version" \
              --notes-file apps/mobile/RELEASE_NOTES.md \
              --target "$GITHUB_SHA"
          fi
