name: Mobile

on:
  pull_request:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']
  push:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']

jobs:
  flutter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [packages/inveon_core, customer_app, organizer_app]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        if: matrix.project != 'packages/inveon_core'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Install packages
        working-directory: apps/mobile/${{ matrix.project }}
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile/${{ matrix.project }}
        run: flutter analyze

      - name: Test
        working-directory: apps/mobile/${{ matrix.project }}
        run: flutter test

      # Proves the Android project (Gradle, plugins, manifest) builds.
      # Without google-services.json push is simply off in this build.
      - name: Build debug APK
        if: matrix.project != 'packages/inveon_core'
        working-directory: apps/mobile/${{ matrix.project }}
        run: flutter build apk --debug
