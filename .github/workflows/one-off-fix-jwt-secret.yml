name: One-off — fix events-api JWT_SECRET

# Manually triggered only. A previous manual attempt to add JWT_SECRET
# either wasn't run or didn't take — every login/signup/verify-otp call
# still fails with "JWT_SECRET is not set". Using the same reliable
# automated approach as the earlier DATABASE_URL fix rather than risking
# a third round of manual copy-paste. Meant to be deleted once confirmed
# working.
on:
  workflow_dispatch:

jobs:
  fix-jwt-secret:
    runs-on: ubuntu-latest
    environment: "AWS 13.51.250.242"
    steps:
      - name: SSH in, fix JWT_SECRET, check SMTP status
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            ENV_FILE=/var/www/Events/apps/api/.env

            if grep -q '^JWT_SECRET=.\+' "$ENV_FILE"; then
              echo "JWT_SECRET already has a value — not touching it. The error must be coming from somewhere else; investigate further."
            else
              NEWSECRET=$(openssl rand -hex 32)
              grep -v '^JWT_SECRET=' "$ENV_FILE" > /tmp/api.env.new
              echo "JWT_SECRET=${NEWSECRET}" >> /tmp/api.env.new
              mv /tmp/api.env.new "$ENV_FILE"
              echo "JWT_SECRET was empty or missing — generated and added a new one."
            fi

            echo "--- SMTP configuration check ---"
            if grep -q '^SMTP_USER=.\+' "$ENV_FILE" && grep -q '^SMTP_PASS=.\+' "$ENV_FILE"; then
              echo "SMTP_USER and SMTP_PASS both have values — email sending should be configured."
            else
              echo "SMTP_USER and/or SMTP_PASS are missing or empty — email sending is NOT configured."
              echo "Every OTP is currently only being logged server-side, never actually emailed."
            fi

            cd ~/inveontechnologies-website
            docker compose restart events-api
            sleep 8

            echo "--- Login test ---"
            curl -s -o /tmp/login_test.json -w "HTTP %{http_code}\n" -X POST https://events.inveontechnologies.in/api/auth/login \
              -H 'Content-Type: application/json' \
              -d '{"email":"owner@ecopandhari.example","password":"password123"}'
            cat /tmp/login_test.json
            echo
