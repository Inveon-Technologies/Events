name: One-off — fix events-api JWT_SECRET

# Manually triggered only. A previous manual attempt to add JWT_SECRET
# either wasn't run or didn't take — every login/signup/verify-otp call
# still fails with "JWT_SECRET is not set". Using the same reliable
# automated approach as the earlier DATABASE_URL fix rather than risking
# a third round of manual copy-paste. Meant to be deleted once confirmed
# working.
on:
  workflow_dispatch:

jobs:
  fix-jwt-secret:
    runs-on: ubuntu-latest
    environment: "AWS 13.51.250.242"
    steps:
      - name: SSH in, fix JWT_SECRET, check SMTP status
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            NEWSECRET=$(openssl rand -hex 32)
            grep -v "^JWT_SECRET=" /var/www/Events/apps/api/.env > /tmp/api.env.new
            echo "JWT_SECRET=$NEWSECRET" >> /tmp/api.env.new
            mv /tmp/api.env.new /var/www/Events/apps/api/.env
            echo "JWT_SECRET set"

            grep -c "SMTP_USER=" /var/www/Events/apps/api/.env || true
            grep -c "SMTP_PASS=" /var/www/Events/apps/api/.env || true

            cd /home/ubuntu/inveontechnologies-website
            docker compose restart events-api
            sleep 8

            curl -s -o /tmp/login_test.json -w "HTTP %{http_code}\n" -X POST https://events.inveontechnologies.in/api/auth/login -H "Content-Type: application/json" -d "{\"email\":\"owner@ecopandhari.example\",\"password\":\"password123\"}"
            cat /tmp/login_test.json
