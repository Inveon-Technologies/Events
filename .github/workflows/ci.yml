name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      # actions/setup-node's cache step fails the whole job with "unable to
      # cache dependencies" if apps/<app>/package-lock.json doesn't exist yet.
      # `npm ci` also requires that file to exist, so commit a real lockfile
      # per app (apps/api/package-lock.json, apps/web/package-lock.json) —
      # this isn't optional plumbing, both the cache step and npm ci need it.
      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm ci

      - name: Lint
        working-directory: apps/${{ matrix.app }}
        run: npm run lint

      - name: Type check
        working-directory: apps/${{ matrix.app }}
        run: npm run typecheck --if-present

      # Each app's own `test` script decides how it wants to run in CI (e.g.
      # the api bakes `--ci` into its Jest script) since api (Jest) and web
      # (Vitest) don't share the same CLI flags.
      - name: Unit tests
        working-directory: apps/${{ matrix.app }}
        run: npm test

      - name: Build
        working-directory: apps/${{ matrix.app }}
        run: npm run build

  # Runs DB/Redis-dependent test suites specifically, on every PR touching
  # the API: booking-concurrency (the oversell-prevention logic, BE-11 —
  # must never go green by accident) and the signup/OTP integration tests
  # (real account creation + email verification against a real DB+Redis).
  concurrency-tests:
    runs-on: ubuntu-latest
    needs: lint-test-build
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: inveon_events_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg (for ffprobe — video-duration validation in event media upload tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        working-directory: apps/api
        run: npm ci

      - name: Run migrations against test DB
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/inveon_events_test
        run: npm run migrate

      - name: Run booking concurrency tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/inveon_events_test
          REDIS_URL: redis://localhost:6379
        run: npm run test:concurrency

      - name: Run signup/OTP integration tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/inveon_events_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret
        run: npm run test:integration