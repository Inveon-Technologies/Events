name: One-off — fix events-api DATABASE_URL

# Manually triggered only (no automatic trigger on push/PR) — this is a
# single-purpose fix for a specific production credential misconfiguration
# (apps/api/.env had DATABASE_URL pointing at the wrong username/password
# for events-postgres), not a standing "run arbitrary ops" capability.
# Meant to be deleted once it's confirmed to have worked.
on:
  workflow_dispatch:

jobs:
  fix-db-url:
    runs-on: ubuntu-latest
    environment: "AWS 13.51.250.242"
    steps:
      - name: SSH in and fix DATABASE_URL
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            PGPASS=$(grep -m1 '^EVENTS_POSTGRES_PASSWORD=' ~/inveontechnologies-website/.env | cut -d= -f2-)
            if [ -z "$PGPASS" ]; then
              echo "Could not find EVENTS_POSTGRES_PASSWORD in ~/inveontechnologies-website/.env"
              exit 1
            fi

            cd ~/inveontechnologies-website

            # POSTGRES_PASSWORD only takes effect the very first time a
            # fresh volume is initialized — if the .env value was ever
            # changed afterward, the actual database user's password
            # silently keeps the old one, which is exactly what the
            # previous run's logs showed ("password authentication failed
            # for user events" even with the username now correct). Makes
            # the actual password match the .env file, not the other way
            # around. Escapes any embedded single quote by doubling it
            # (standard SQL string-literal escaping) so this is safe
            # regardless of what characters the password contains — tested
            # locally against a password containing a quote, #, and =
            # before trusting this against production (psql's :'var'
            # substitution was tried first and, contrary to expectation,
            # didn't work via -c; this plain-escaping approach did).
            ESCAPED_PGPASS=$(printf '%s' "$PGPASS" | sed "s/'/''/g")
            docker compose exec -T events-postgres psql -U events -d events -c "ALTER USER events WITH PASSWORD '${ESCAPED_PGPASS}';"

            # Treat the password as pure data, never as part of a sed/regex
            # pattern — a previous attempt built a sed program string with
            # the password embedded in it, which broke (unterminated 's'
            # command) because the real value collided with the delimiter.
            # This rewrites the file with plain string concatenation
            # instead, immune to whatever characters the password contains.
            grep -v '^DATABASE_URL=' /var/www/Events/apps/api/.env > /tmp/api.env.new
            echo "DATABASE_URL=postgres://events:${PGPASS}@events-postgres:5432/events" >> /tmp/api.env.new
            mv /tmp/api.env.new /var/www/Events/apps/api/.env
            echo "DATABASE_URL now (password masked):"
            grep DATABASE_URL /var/www/Events/apps/api/.env | sed -E 's/(:\/\/[^:]+:)[^@]+(@)/\1***\2/'

            docker compose restart events-api
            sleep 8

            echo "--- Login test ---"
            curl -s -o /tmp/login_test.json -w "HTTP %{http_code}\n" -X POST https://events.inveontechnologies.in/api/auth/login \
              -H 'Content-Type: application/json' \
              -d '{"email":"owner@ecopandhari.example","password":"password123"}'
            cat /tmp/login_test.json
            echo
