name: inveon_core
description: Shared design system, API client, push notifications and update prompt for the Inveon Events mobile apps.
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.13.7
  flutter: ">=1.17.0"

dependencies:
  cached_network_image: ^4.0.5
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^22.3.3
  flutter_secure_storage: ^11.2.0
  google_fonts: ^6.3.3
  http: ^1.6.0
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  assets:
    - assets/images/
